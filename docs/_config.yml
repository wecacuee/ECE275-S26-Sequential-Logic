      url: "https://docs.google.com/spreadsheets/d/1OSEpBjFAET5f36YH7c3v1em5t80NcQ9FujoXGg2Tdww/edit?gid=713728794#gid=713728794"
    - title: Zoom Link
      url: "/z/app"

  portfolio_image: images/Transistor_Bistable_interactive_animated-en.svg
    
  condensed_mobile:
    - home
    - post
    - page

