url: https://vikasdhiman.info
baseurl: /ECE275-S25-Sequential-Logic
remote_theme:  samarsault/plainwhite-jekyll
title: Sequential Logic Systems (ECE275) at the University of Maine
author: Vikas Dhiman
description: Sequential Logic Systems (ECE275) at the University of Maine
show_excerpts: true


# Some configuration settings cannot be changed for GitHub Pages sites.
lsi: false
safe: true
# source: [your repo's top level directory]
# incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
# Some configuration settings cannot be changed for GitHub Pages sites.

# Build settings
markdown: kramdown
permalink: pretty
paginate: 10


header_pages:
  - category/lecture

plainwhite:
  name: Sequential Logic Systems (ECE275)
  tagline: |
     Boolean algebra, Flip-flops, K-Maps, Verilog

  sitemap: true

  search: true

  html_lang: "en"

  navigation:
    - title: Syllabus
      url: "https://docs.google.com/document/d/1qqhjNXyHaTTvUJdN9x1gTGiUzaKj9tkG/edit"
